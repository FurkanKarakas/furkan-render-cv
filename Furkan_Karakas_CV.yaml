          JIRA,
          HPQC,
          Graph Neural Networks,
          VaR Computation,
          Time Series Analysis

    experience:
      - company: PostFinance AG
        position: Software Test Automation Engineer
        location: Bern, Switzerland
        start_date: 2024-05
        end_date: present
        highlights:
          - Automated independent end-to-end tests of the company web
            and mobile applications on the system level
            by means of black-box testing using an internal test automation toolbox
            built on top of Appium and Selenium
          - Detected and reported countless bugs and issues in the diverse frontend and backend systems of the company,
            contributing to the overall quality of the applications
          - Worked in four releases in a year using agile methodology
          - Used the issue tracking service JIRA and the application lifecycle management tool HPQC
      - company: ZZ Vermögensberatung (Schweiz) AG
        position: Financial Software Engineer
        location: Vitznau, Switzerland
        start_date: 2022-07
        end_date: 2024-04
        highlights:
          - Developed internal "Knowledge Base" web app using React.js,
            Spring Boot, and PostgreSQL, streamlining business processes for 25+ colleagues
          - Built automated CI/CD pipelines using GitLab runners in Docker for seamless
            application deployment to prod/dev environments, over 80% improvement of build time
            of the web application
          - Created in-house Value-at-Risk computation framework in Python integrated with
            company data warehouse using Pandas/NumPy
          - Parsed XML files to identify data load errors in Java,
            enabling team to review and correct issues daily
      - company: Hoffmann-La Roche
        position: Master's Thesis Student
        location: Basel, Switzerland
        start_date: 2021-09
        end_date: 2022-02
        highlights:
          - Conducted literature review on corporate skills management using machine learning
          - Implemented and evaluated graph neural network method to learn skill representations
          - Achieved 72% F1-score on skill prediction task by collaborating cross-functionally
      - company: ABB Corporate Research Center
        position: Student Internship
        location: Baden, Switzerland
        start_date: 2020-07
        end_date: 2020-12
        highlights:
          - Designed Docker containers interacting on Hyperledger Fabric blockchain to store IoT sensor data
          - Built React.js front-end application interfacing with the blockchain network

    education:
      - institution: Swiss Federal Institute of Technology Lausanne (EPFL)
