    summary:
      - Software and quality assurance engineer with 5+ years of experience in software testing, test automation, developing full-stack applications, data integration solutions.
        Strong background in Java, Python, React.js, SQL/databases and test automation frameworks such as Selenium, Playwright and Appium.
        Adept at cloud technologies like Docker and CI/CD pipelines.
        Earned MSc. in Communication Systems from EPFL with 5.20/6.0 GPA.
